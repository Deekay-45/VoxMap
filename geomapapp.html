<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Voice Map Navigation</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: Arial, sans-serif;
      background: #eaf6ff;
    }
    #map {
      height: 90vh;
      width: 100%;
    }
    #controls {
      text-align: center;
      padding: 10px;
      background: #4a90e2;
      color: white;
    }
    button {
      padding: 10px 20px;
      border: none;
      border-radius: 6px;
      background: #fff;
      color: #4a90e2;
      font-weight: bold;
      cursor: pointer;
    }
    button:hover {
      background: #f0f0f0;
    }
  </style>
</head>
<body>
  <div id="controls">
    <h2>🎤 Voice Map Navigation</h2>
    <button onclick="startListening()">Start Voice Command</button>
    <p id="status">
      Try: "zoom in", "zoom out", "go to Mumbai", "satellite view", "street view", 
      "distance between Delhi and Agra"
    </p>
  </div>
  <div id="map"></div>

  <script>
  
    var map = L.map('map').setView([28.6139, 77.2090], 6); // New Delhi
    var streetLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);
    var satelliteLayer = L.tileLayer('https://{s}.google.com/vt/lyrs=s&x={x}&y={y}&z={z}', {
      maxZoom: 20,
      subdomains:['mt0','mt1','mt2','mt3']
    });
    var distanceLayer;
    function calculateDistance(lat1, lon1, lat2, lon2) {
      function toRad(x) { return x * Math.PI / 180; }
      var R = 6371; // Earth radius in km
      var dLat = toRad(lat2 - lat1);
      var dLon = toRad(lon2 - lon1);
      var a = Math.sin(dLat/2) * Math.sin(dLat/2) +
              Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) *
              Math.sin(dLon/2) * Math.sin(dLon/2);
      var c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
      return R * c;
    }
    function handleCommand(command) {
      command = command.toLowerCase();

      if (command.includes("zoom in")) {
        map.zoomIn();
      } 
      else if (command.includes("zoom out")) {
        map.zoomOut();
      } 
      else if (command.includes("satellite")) {
        map.removeLayer(streetLayer);
        map.addLayer(satelliteLayer);
      } 
      else if (command.includes("street")) {
        map.removeLayer(satelliteLayer);
        map.addLayer(streetLayer);
      } 
      else if (command.includes("go to")) {
        let place = command.replace("go to", "").trim();
        document.getElementById("status").innerText = "🔎 Searching: " + place;

        fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${place}`)
          .then(res => res.json())
          .then(data => {
            if (data.length > 0) {
              let lat = data[0].lat, lon = data[0].lon;
              map.setView([lat, lon], 10);
              L.marker([lat, lon]).addTo(map).bindPopup("📍 " + place).openPopup();
              document.getElementById("status").innerText = "✅ Moved to " + place;
            } else {
              document.getElementById("status").innerText = "❌ Place not found!";
            }
          });
      }
      else if (command.includes("distance between")) {
        let parts = command.replace("distance between", "").trim().split(" and ");
        if (parts.length === 2) {
          let place1 = parts[0].trim();
          let place2 = parts[1].trim();
          document.getElementById("status").innerText = `📍 Calculating distance between ${place1} and ${place2}...`;

          Promise.all([
            fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${place1}`).then(res => res.json()),
            fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${place2}`).then(res => res.json())
          ]).then(results => {
            let data1 = results[0], data2 = results[1];
            if (data1.length > 0 && data2.length > 0) {
              let lat1 = parseFloat(data1[0].lat), lon1 = parseFloat(data1[0].lon);
              let lat2 = parseFloat(data2[0].lat), lon2 = parseFloat(data2[0].lon);

              if (distanceLayer) map.removeLayer(distanceLayer);

              distanceLayer = L.polyline([[lat1, lon1], [lat2, lon2]], {color: 'red'}).addTo(map);
              map.fitBounds(distanceLayer.getBounds());

              let dist = calculateDistance(lat1, lon1, lat2, lon2).toFixed(2);
              L.marker([lat1, lon1]).addTo(map).bindPopup(place1).openPopup();
              L.marker([lat2, lon2]).addTo(map).bindPopup(place2).openPopup();

              document.getElementById("status").innerText = `📏 Distance between ${place1} and ${place2}: ${dist} km`;
            } else {
              document.getElementById("status").innerText = "❌ Could not find one or both places.";
            }
          });
        } else {
          document.getElementById("status").innerText = "❌ Please say: distance between [place1] and [place2]";
        }
      }
      else {
        document.getElementById("status").innerText = "❌ Command not recognized.";
      }
    }

    function startListening() {
      const status = document.getElementById("status");

      if ('webkitSpeechRecognition' in window) {
        let recognition = new webkitSpeechRecognition();
        recognition.lang = "en-US";
        recognition.start();

        status.innerText = "🎙️ Listening...";

        recognition.onresult = function(event) {
          let transcript = event.results[0][0].transcript;
          status.innerText = "✅ You said: " + transcript;
          handleCommand(transcript);
        };

        recognition.onerror = function() {
          status.innerText = "⚠️ Error recognizing speech.";
        };
      } else {
        status.innerText = "⚠️ Browser does not support speech recognition.";
      }
    }
  </script>
</body>
</html>
